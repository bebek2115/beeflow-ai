<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>BeeFlow AI — Leady</title>
<style>
:root{--bg:#0b0d10;--panel:#12171d;--line:#26303a;--txt:#f7f9fb;--muted:#96a2ae;--accent:#f5b800;--good:#42d392}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial}.wrap{max-width:1180px;margin:auto;padding:30px 20px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}.brand{font-size:24px;font-weight:900}.muted{color:var(--muted)}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800;cursor:pointer;background:var(--accent);color:#111}.ghost{background:#151b21;color:white;border:1px solid var(--line)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:28px 0}.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.stat b{font-size:30px;display:block}.table{overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--panel)}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:14px 13px;border-bottom:1px solid #202832;font-size:14px}th{color:#b9c2cb;font-size:12px;text-transform:uppercase;letter-spacing:.5px}.pill{display:inline-block;border-radius:999px;padding:6px 9px;background:#1c242d;color:#dce3ea;font-size:12px}.empty{padding:45px;text-align:center;color:var(--muted)}a{color:inherit;text-decoration:none}@media(max-width:650px){.stats{grid-template-columns:1fr}.wrap{padding:20px 14px}}
</style></head>
<body><div class="wrap"><div class="top"><div><div class="brand">🐝 BeeFlow AI — Leady</div><div class="muted">Panel demonstracyjny MVP</div></div><div class="actions"><a class="btn ghost" href="index.html">← Strona</a><button class="btn ghost" onclick="exportCSV()">Eksport CSV</button><button class="btn" onclick="clearLeads()">Wyczyść demo</button></div></div><div class="stats"><div class="stat"><span class="muted">Wszystkie leady</span><b id="all">0</b></div><div class="stat"><span class="muted">Z czatu</span><b id="chat">0</b></div><div class="stat"><span class="muted">Z formularza</span><b id="form">0</b></div></div><div class="table"><table><thead><tr><th>Data</th><th>Źródło</th><th>Firma / branża</th><th>Potrzeba</th><th>Miasto</th><th>Telefon</th><th>E-mail</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty">Brak leadów. Wejdź na stronę i przetestuj formularz albo czat.</div></div></div>
<script>
function getLeads(){return JSON.parse(localStorage.getItem('beeflow_leads')||'[]').reverse()}
function render(){const leads=getLeads();all.textContent=leads.length;chat.textContent=leads.filter(x=>x.source==='chat').length;form.textContent=leads.filter(x=>x.source==='form').length;rows.innerHTML='';empty.style.display=leads.length?'none':'block';leads.forEach(l=>{const tr=document.createElement('tr');const date=l.createdAt?new Date(l.createdAt).toLocaleString('pl-PL'):'—';const industry=l.name||l.industry||'—';tr.innerHTML=`<td>${esc(date)}</td><td><span class="pill">${esc(l.source||'—')}</span></td><td>${esc(industry)}</td><td>${esc(l.need||'—')}</td><td>${esc(l.city||'—')}</td><td>${esc(l.phone||'—')}</td><td>${esc(l.email||'—')}</td>`;rows.appendChild(tr)})}
function esc(v){return String(v).replace(/[&<>'"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[s]))}
function clearLeads(){if(confirm('Usunąć wszystkie testowe leady?')){localStorage.removeItem('beeflow_leads');render()}}
function exportCSV(){const data=getLeads();if(!data.length)return alert('Brak leadów do eksportu.');const h=['data','zrodlo','firma_branza','potrzeba','miasto','telefon','email'];const q=v=>'"'+String(v??'').replaceAll('"','""')+'"';const lines=[h.join(';'),...data.map(l=>[l.createdAt,l.source,l.name||l.industry,l.need,l.city,l.phone,l.email].map(q).join(';'))];const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='beeflow-leady.csv';a.click();URL.revokeObjectURL(a.href)}
render();
</script></body></html>
